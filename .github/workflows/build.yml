name: Build PearDesk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libgl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libxtst-dev \
            pkg-config gcc wget

      - name: Build Linux binary
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o PearDesk ./cmd/peardesk

      - name: Package AppImage
        run: |
          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp PearDesk AppDir/usr/bin/peardesk
          cp assets/icon.png AppDir/peardesk.png
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/peardesk.png

          cat > AppDir/peardesk.desktop << 'EOF'
          [Desktop Entry]
          Name=PearDesk
          Exec=peardesk
          Icon=peardesk
          Type=Application
          Categories=Network;RemoteAccess;
          EOF

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          exec "${APPDIR}/usr/bin/peardesk" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            /tmp/appimagetool AppDir PearDesk-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: peardesk-linux
          path: PearDesk-linux-x86_64.AppImage

  build-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64 pkg-config

      - name: Build Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          go build -ldflags="-s -w -H=windowsgui" \
            -o PearDesk.exe ./cmd/peardesk

      - uses: actions/upload-artifact@v4
        with:
          name: peardesk-windows
          path: PearDesk.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build macOS binary
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -ldflags="-s -w" -o PearDesk ./cmd/peardesk

      - name: Create DMG
        run: |
          mkdir dmg-staging
          mkdir dmg-staging/PearDesk.app
          mkdir dmg-staging/PearDesk.app/Contents
          mkdir dmg-staging/PearDesk.app/Contents/MacOS
          cp PearDesk dmg-staging/PearDesk.app/Contents/MacOS/PearDesk

          hdiutil create \
            -volname "PearDesk" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            PearDesk.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: peardesk-macos
          path: PearDesk.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/PearDesk-linux-x86_64.AppImage
            artifacts/PearDesk.exe
            artifacts/PearDesk.dmg
