name: PearDesk 3.0 Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build-linux:
    name: Build AppImage (Linux)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Install FLTK deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
          libgl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev libfreetype6-dev \
          libxtst-dev pkg-config gcc libfltk1.3-dev libxext-dev libxft-dev libxrender-dev

    - name: Build Go app (backend + UI)
      run: |
        go build -o peardesk-linux ./cmd/peardesk

    - name: Prepare AppDir
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/icons
        mkdir -p AppDir/usr/share/applications

        cp peardesk-linux AppDir/usr/bin/peardesk
        cp assets/icon.png AppDir/usr/share/icons/peardesk.png

        cat > AppDir/usr/share/applications/peardesk.desktop <<EOF
        [Desktop Entry]
        Name=PearDesk
        Exec=peardesk
        Icon=peardesk
        Type=Application
        Categories=Utility;
        EOF

    - name: Download appimagetool
      run: |
        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Build AppImage
      run: |
        ./appimagetool-x86_64.AppImage AppDir PearDesk-3.0.0-x86_64.AppImage

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk-3.0.0-AppImage
        path: PearDesk-3.0.0-x86_64.AppImage


  build-windows:
    name: Build EXE (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Build Windows EXE
      run: |
        go build -o PearDesk-3.0.0.exe ./cmd/peardesk

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk-3.0.0-EXE
        path: PearDesk-3.0.0.exe


  build-macos:
    name: Build macOS (Intel)
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Build macOS binary
      run: |
        go build -o PearDesk-3.0.0-macos ./cmd/peardesk

    - name: Zip macOS binary
      run: |
        zip PearDesk-3.0.0-macos.zip PearDesk-3.0.0-macos

    - name: Upload macOS zip
      uses: actions/upload-artifact@v4
      with:
        name: PearDesk-3.0.0-macOS
        path: PearDesk-3.0.0-macos.zip
