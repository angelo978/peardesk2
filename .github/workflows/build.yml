name: PearDesk Build

on:
  push:
    branches: ["master"]
    tags-ignore: ["*"]
  pull_request:
    branches: ["master"]

jobs:

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          check-latest: true

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libgl1-mesa-dev libgles2-mesa-dev libfontconfig1-dev \
            libfreetype6-dev libxtst-dev libxxf86vm-dev pkg-config gcc wget

      - name: Build binary
        run: |
          go env
          go build -o peardesk-linux ./cmd/peardesk

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications

          cp peardesk-linux AppDir/usr/bin/peardesk

          echo "[Desktop Entry]" > AppDir/usr/share/applications/peardesk.desktop
          echo "Name=PearDesk" >> AppDir/usr/share/applications/peardesk.desktop
          echo "Exec=peardesk" >> AppDir/usr/share/applications/peardesk.desktop
          echo "Icon=peardesk" >> AppDir/usr/share/applications/peardesk.desktop
          echo "Type=Application" >> AppDir/usr/share/applications/peardesk.desktop
          echo "Categories=Utility;" >> AppDir/usr/share/applications/peardesk.desktop

          echo '#!/bin/bash' > AppDir/AppRun
          echo 'exec usr/bin/peardesk' >> AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool-x86_64.AppImage AppDir PearDesk.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: PearDesk-AppImage
          path: PearDesk.AppImage
